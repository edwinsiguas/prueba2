spring.application.name=mtc-java-service
server.port=${PORT:8080}

# Conexión a Base de Datos MySQL (soporta variables estándar de Render/Cloud y fallback a XAMPP local)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:marcona_permisos}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${DB_PASS:}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never

# Pool Hikari optimizado para Render (512 MB RAM) y MySQL Cloud
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# Configuración JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Configuración de Aplicación y Entorno
app.environment=${APP_ENV:development}
app.jwt-secret=${JWT_SECRET:${_SECRET:dev_only_change_me}}
app.-secret=${_SECRET:${JWT_SECRET:dev_only_change_me}}
app.jwt-expiry-seconds=${JWT_EXPIRY:${_EXPIRY:86400}}
app.-expiry-seconds=${_EXPIRY:${JWT_EXPIRY:86400}}
app.audit-file=${APP_AUDIT_FILE:logs/database-audit.jsonl}
app.api-url=${API_URL:http://localhost:8080}
app.uploads-dir=${UPLOADS_DIR:uploads}

# Configuración de Carga de Archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
server.tomcat.max-part-count=200
server.tomcat.max-part-header-size=4096
server.tomcat.max-parameter-count=10000

# Logs
logging.level.root=INFO
logging.level.pe.marcona.mtc=INFO

# Monitoreo y Mantenimiento Operacional (Spring Boot Actuator)
# /actuator/health es público (Render / UptimeRobot). El resto (/metrics, /prometheus, /info) lo protege ActuatorProtectionFilter.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
management.metrics.tags.application=mtc-java-service
info.app.name=MTC Marcona - Servicio Java
info.app.version=@project.version@
info.app.java=${java.version}
# Token opcional para scraping externo de /actuator/** (definir solo en entorno, nunca en código)
app.monitoring.scrape-token=${MONITORING_SCRAPE_TOKEN:}

# Mantenimiento automatizado (Cron Jobs en zona America/Lima)
app.maintenance.timezone=America/Lima
app.maintenance.system-actor-id=${MAINTENANCE_SYSTEM_ACTOR_ID:1}
app.maintenance.expire-permits.cron=${CRON_EXPIRE_PERMITS:0 5 0 * * *}
app.maintenance.cleanup-rate-limits.cron=${CRON_CLEANUP_RATE_LIMITS:0 30 2 * * *}
app.maintenance.check-upcoming.cron=${CRON_CHECK_UPCOMING_EXPIRATIONS:0 0 7 * * *}
app.maintenance.rate-limits-retention-hours=${RATE_LIMITS_RETENTION_HOURS:24}
app.maintenance.upcoming-days=${UPCOMING_EXPIRATION_DAYS:15}

# Documentación Interactiva OpenAPI 3 (Swagger UI)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
